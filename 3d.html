<!doctype html><html lang=vi><head><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'></head><body><title>Nhà 4,2×18 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@500;600&display=swap">
<style>
/* Layout: canvas 3D tràn màn hình, chip tiêu đề trên cùng, thanh nút nổi dưới đáy (vừa ngón cái) */
:root{
  --bg:#dfe7ec; --sky:#dfe7ec; --panel:rgba(255,255,255,.92); --ink:#17212b; --ink2:#5b6873;
  --line:#d2d9d5; --accent:#285b8c; --accent-ink:#ffffff;
  --f-label:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141b21; --sky:#1b242c; --panel:rgba(23,32,40,.92); --ink:#e6ecf1; --ink2:#98a6b2;
  --line:#2a3540; --accent:#82b4e3; --accent-ink:#0f1418; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141b21; --sky:#1b242c; --panel:rgba(23,32,40,.92); --ink:#e6ecf1; --ink2:#98a6b2;
  --line:#2a3540; --accent:#82b4e3; --accent-ink:#0f1418; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
.chip{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:calc(env(safe-area-inset-left,0px) + 12px);
  right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;
  pointer-events:none}
.chip h1{margin:0;font-family:var(--f-label);font-size:22px;font-weight:700;letter-spacing:.3px;
  background:var(--panel);padding:4px 10px;border-radius:4px;pointer-events:auto}
.chip p{margin:0;font-size:13px;color:var(--ink2);background:var(--panel);padding:3px 8px;border-radius:4px;
  font-variant-numeric:tabular-nums}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:8px;align-items:center;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:var(--panel);padding:6px;border-radius:6px;
  border:1px solid var(--line);max-width:100%}
button{font-family:var(--f-label);font-size:16px;font-weight:600;letter-spacing:.4px;color:var(--ink);
  background:transparent;border:1px solid var(--line);border-radius:4px;padding:7px 12px;min-height:38px;cursor:pointer}
button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.walk{font-family:var(--f-label);font-size:16px;font-weight:600;letter-spacing:.4px;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:7px 12px;min-height:38px;display:inline-flex;align-items:center;text-decoration:none}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12px;color:var(--ink2);background:var(--panel);padding:2px 8px;border-radius:4px}
#err{position:fixed;inset:auto 16px 50% 16px;text-align:center;background:var(--panel);padding:12px;border-radius:6px}
</style>

<div id="stage" aria-label="Mô hình 3D nhà phố 4,2 × 18 m"></div>
<div class="chip">
  <h1>Nhà phố 4,2 × 18 m · 3D</h1>
  <p>Nền +0,32 · Trệt 3,78 m · Lầu 3,6 m</p>
</div>
<div class="bar">
  <div class="row" role="group" aria-label="Chọn tầng">
    <button id="v-all" data-view="all">Cả nhà</button>
    <button id="v-noroof" data-view="noroof">Bỏ mái (xem lầu)</button>
    <button id="v-ground" data-view="ground">Tầng trệt</button>
  </div>
  <div class="row">
    <button id="t-side" aria-pressed="false">Ẩn tường hông</button>
    <button id="t-label" aria-pressed="true">Tên phòng</button>
    <button id="t-reset">Góc nhìn đầu</button>
    <a class="walk" href="di-bo.html">Đi bộ trong nhà</a>
  </div>
  <span class="hint">1 ngón: xoay · 2 ngón: phóng to, kéo</span>
</div>
<div id="err" hidden>Không tải được thư viện 3D. Kiểm tra kết nối mạng rồi mở lại trang.</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="mo-hinh-3d.js"></script>
<script>
(() => {
if (!window.THREE || !THREE.OrbitControls) { document.getElementById('err').hidden = false; return; }

const { scene, U, RF, CEIL, LG, LU } = nha3D();
CEIL.visible = false;

const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const camera = new THREE.PerspectiveCamera(45, 1, .1, 200);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * .495;
controls.minDistance = 3; controls.maxDistance = 60;
// Góc nhìn đầu: từ phía trước, trên cao, nhìn dọc theo nhà; màn hình dọc thì lùi xa hơn để thấy hết 18 m
function resetCam() {
  const k = Math.max(1, 1 / Math.max(camera.aspect, .3) ** .5);
  controls.target.set(2.1, 2, 9);
  camera.position.set(2.1 + 6 * k, 2 + 17 * k, 9 - 15 * k);
  controls.update();
}

function skyColor() { scene.background = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--sky').trim() || '#dfe7ec'); }
skyColor();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', skyColor);
new MutationObserver(skyColor).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

function resize() {
  const w = stage.clientWidth, hh = stage.clientHeight;
  renderer.setSize(w, hh, false); camera.aspect = w / hh; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize(); resetCam();

// ---------- nút ----------
const viewBtns = [...document.querySelectorAll('[data-view]')];
let view = 'noroof', showLabels = true;
function setView(v) {
  view = v;
  U.visible = v !== 'ground'; RF.visible = v === 'all';
  LG.visible = showLabels && v === 'ground'; LU.visible = showLabels && v === 'noroof';
  viewBtns.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
}
viewBtns.forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
const toggle = (id, fn) => document.getElementById(id).addEventListener('click', e => {
  const on = e.currentTarget.getAttribute('aria-pressed') !== 'true';
  e.currentTarget.setAttribute('aria-pressed', String(on)); fn(on);
});
toggle('t-side', on => scene.traverse(o => { if (o.userData.side) o.visible = !on; }));
toggle('t-label', on => { showLabels = on; setView(view); });
document.getElementById('t-reset').addEventListener('click', resetCam);
setView('noroof');

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
})();
</script>
